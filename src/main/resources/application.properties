spring.application.name=agendamento

# 1. Configuração do Banco H2 em Memória com nome fixo
spring.datasource.url=jdbc:h2:mem:agendamentodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Habilita o Console Web do H2 no Navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 3. Mostra os comandos SQL formatados no terminal do IntelliJ
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
